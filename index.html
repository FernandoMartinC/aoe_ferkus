<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard AOE2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page-wrapper">

    <header class="site-header">
      <div class="header-ornament">⚔</div>
      <h1>Dashboard de Datos</h1>
      <p class="header-subtitle">Age of Empires II — Seguimiento de ELO</p>
      <div class="header-ornament">⚔</div>
    </header>

    <main>

      <!-- CARDS DE JUGADORES -->
      <section class="section-block">
        <h2><span class="section-icon">🏆</span> Ranking de Jugadores</h2>
        <div class="filters-bar filters-bar--inline">
          <div class="filter-group">
            <span class="filter-label">Modo</span>
            <select id="select-modo"></select>
          </div>
        </div>
        <div id="cards-container" class="cards-grid"></div>
      </section>

      <!-- GRÁFICO -->
      <section class="section-block">
        <h2><span class="section-icon">📈</span> Evolución de ELO</h2>
        <div class="filters-bar">
          <div class="filter-group">
            <span class="filter-label">Jugadores</span>
            <div id="checkbox-usuarios"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">Fechas</span>
            <div class="date-range">
              <label>Desde <input type="date" id="fecha-desde"></label>
              <label>Hasta <input type="date" id="fecha-hasta"></label>
              <button id="filtrar-fechas">Aplicar</button>
            </div>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="eloChart" height="100"></canvas>
        </div>
      </section>

      <!-- TABLA ÚLTIMO DÍA -->
      <section class="section-block">
        <h2><span class="section-icon">🗡</span> Datos de Hoy</h2>
        <div class="table-wrapper">
          <table id="tabla-ayer"></table>
        </div>
      </section>

      <!-- TABLA HISTÓRICA -->
      <section class="section-block">
        <h2><span class="section-icon">📜</span> Histórico Completo</h2>
        <div class="table-wrapper">
          <table id="tabla-historico"></table>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <span>⚔ AOE2 ELO Tracker ⚔</span>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
