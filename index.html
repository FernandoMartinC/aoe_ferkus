<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard AOE2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Dashboard de datos</h1>
    <h2>Evolución de ELO</h2>

    <div id="usuarios-container">
        <label style="margin-left:20px">
        <strong>Usuarios:</strong>
        <div id="checkbox-usuarios"></div>
        </div>
        <label style="margin-left:20px">
        <strong>Modo:</strong>
        <select id="select-modo"></select>
        </div>
        <label style="margin-left:20px">
        <strong>Fechas:</strong>
        <label>Desde: <input type="date" id="fecha-desde"></label>
        <label>Hasta: <input type="date" id="fecha-hasta"></label>
        <button id="filtrar-fechas">Aplicar filtro</button>

        <br><br>
    
    <canvas id="eloChart" height="100"></canvas>
 
    <h2>Datos de ayer</h2>
    <table id="tabla-ayer"></table>

    <h2>Resto de los datos</h2>
    <table id="tabla-historico"></table>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>    
  
  </body>
  
</html>
